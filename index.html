<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Залізничний переїзд</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: #1a1a1a; margin: 0; height: 100vh; font-family: sans-serif; touch-action: manipulation;
        }
        #start-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); 
                         display: flex; justify-content: center; align-items: center; z-index: 10; color: white; cursor: pointer; }
        .container { background: #000; padding: 20px; border-radius: 20px; border: 6px solid #333; display: flex; flex-direction: column; align-items: center; }
        .light { width: 90px; height: 90px; border-radius: 50%; background: #222; margin: 10px; border: 3px solid #444; }
        .red-1.active { background: #ff0000; box-shadow: 0 0 40px #ff0000; }
        .red-2.active { background: #ff0000; box-shadow: 0 0 40px #ff0000; }
        .white.active { background: #e0ffff; box-shadow: 0 0 40px #e0ffff; }
    </style>
</head>
<body>

    <div id="start-screen" onclick="initGame()"><h1>НАТИСНИ, ЩОБ ПОЧАТИ</h1></div>

    <div class="container" onclick="toggleSignal()">
        <div class="light red-1" id="r1"></div>
        <div class="light red-2" id="r2"></div>
        <div class="light white" id="w1"></div>
    </div>

    <script>
        let state = 0;
        let interval;
        let audioCtx;

        function initGame() {
            document.getElementById('start-screen').style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playDing() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = 880;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const s = new SpeechSynthesisUtterance(text);
            s.lang = 'uk-UA';
            window.speechSynthesis.speak(s);
        }

        function toggleSignal() {
            clearInterval(interval);
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            state = (state + 1) % 3;

            if (state === 1) { // Червоні миготять
                speak('Червоний. Поїзд, стій!');
                let toggle = false;
                interval = setInterval(() => {
                    document.getElementById('r1').classList.toggle('active', toggle);
                    document.getElementById('r2').classList.toggle('active', !toggle);
                    if (toggle) playDing();
                    toggle = !toggle;
                }, 600);
            } else if (state === 2) { // Білий
                speak('Білий. Шлях вільний.');
                document.getElementById('w1').classList.add('active');
            } else {
                speak('Світлофор вимкнено.');
            }
        }
    </script>
</body>
</html>
