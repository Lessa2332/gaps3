<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Гра Світлофор</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; background: #f0f0f0; }
        .container { background: #333; padding: 20px; border-radius: 20px; margin-top: 50px; }
        .light { width: 100px; height: 100px; border-radius: 50%; margin: 10px; background: #111; cursor: pointer; transition: 0.3s; }
        
        /* Стани підсвічування */
        .red.active { background: red; box-shadow: 0 0 20px red; }
        .yellow.active { background: yellow; box-shadow: 0 0 20px yellow; }
        .green.active { background: green; box-shadow: 0 0 20px green; }
    </style>
</head>
<body>

    <h1>Натискай на кольори!</h1>
    <div class="container">
        <div class="light red" onclick="playTraffic('red', 'Червоний. Стоп, заборонено!')"></div>
        <div class="light yellow" onclick="playTraffic('yellow', 'Жовтий. Увага, приготуйся!')"></div>
        <div class="light green" onclick="playTraffic('green', 'Зелений. Рух продовжуй!')"></div>
    </div>

    <script>
        function playTraffic(colorClass, message) {
            // Вимикаємо підсвітку у всіх
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            
            // Вмикаємо вибраний
            const activeElement = document.querySelector('.' + colorClass);
            activeElement.classList.add('active');

            // Озвучка
            const speech = new SpeechSynthesisUtterance(message);
            speech.lang = 'uk-UA';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
