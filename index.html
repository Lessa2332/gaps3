<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Веселий Світлофор</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: #f0f8ff; margin: 0; height: 100vh; font-family: 'Comic Sans MS', cursive, sans-serif; 
        }
        .container { 
            background: #333; padding: 25px; border-radius: 40px; border: 8px solid #555; 
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .light { 
            width: 100px; height: 100px; border-radius: 50%; margin: 15px; 
            background: #111; cursor: pointer; transition: 0.3s; border: 4px solid #444;
        }
        .red.active { background: #ff4d4d; box-shadow: 0 0 40px #ff4d4d; border-color: #fff; }
        .yellow.active { background: #ffd633; box-shadow: 0 0 40px #ffd633; border-color: #fff; }
        .green.active { background: #33ff77; box-shadow: 0 0 40px #33ff77; border-color: #fff; }
        
        #timer-box { 
            width: 100px; height: 60px; background: #222; color: #33ff77; margin-top: 20px; 
            display: flex; align-items: center; justify-content: center; font-size: 40px; 
            font-weight: bold; border-radius: 15px; border: 3px solid #555;
        }
        .settings { margin-top: 30px; padding: 15px; background: white; border-radius: 20px; border: 2px solid #ccc; }
        select { font-size: 18px; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="light red" id="redLight" onclick="activate('red')"></div>
        <div class="light yellow" id="yellowLight" onclick="activate('yellow')"></div>
        <div class="light green" id="greenLight" onclick="activate('green')"></div>
        <div id="timer-box">--</div>
    </div>

    <div class="settings">
        <label>Мова / Language: </label>
        <select id="langSelect">
            <option value="uk-UA">Українська 🇺🇦</option>
            <option value="en-GB">English 🇬🇧</option>
        </select>
    </div>

    <script>
        let audioCtx;
        let isRunning = false;

        function playClick() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 600;
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function speak(color) {
            const lang = document.getElementById('langSelect').value;
            const messages = {
                'uk-UA': { red: 'Червоний. Стій!', yellow: 'Жовтий. Увага!', green: 'Зелений. Можна йти!' },
                'en-GB': { red: 'Red light. Stop!', yellow: 'Yellow light. Wait!', green: 'Green light. Go!' }
            };
            
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(messages[lang][color]);
            speech.lang = lang;
            window.speechSynthesis.speak(speech);
        }

        function activate(color) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            if (isRunning && color !== 'red') return;
            if (window.timerInterval) clearInterval(window.timerInterval);
            
            isRunning = true;
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            document.getElementById(color + 'Light').classList.add('active');
            
            speak(color);

            if (color === 'green') {
                let timeLeft = 10;
                document.getElementById('timer-box').innerText = timeLeft;
                window.timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft >= 0) {
                        document.getElementById('timer-box').innerText = timeLeft;
                        playClick();
                    } else {
                        clearInterval(window.timerInterval);
                        document.getElementById('greenLight').classList.remove('active');
                        document.getElementById('timer-box').innerText = "--";
                        isRunning = false;
                    }
                }, 1000);
            } else {
                document.getElementById('timer-box').innerText = "--";
                setTimeout(() => isRunning = false, 1500);
            }
        }
    </script>
</body>
</html>
