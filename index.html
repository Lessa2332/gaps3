<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Світлофор</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; margin: 0; height: 100vh; font-family: sans-serif; touch-action: manipulation; }
        .container { background: #000; padding: 20px; border-radius: 20px; border: 4px solid #444; display: flex; flex-direction: column; align-items: center; }
        .light { width: 80px; height: 80px; border-radius: 50%; margin: 10px; background: #333; transition: 0.2s; }
        .red.active { background: #ff0000; box-shadow: 0 0 30px #ff0000; }
        .yellow.active { background: #ffff00; box-shadow: 0 0 30px #ffff00; }
        .green.active { background: #00ff00; box-shadow: 0 0 30px #00ff00; }
        #timer-box { width: 80px; height: 50px; background: #111; border: 2px solid #555; 
                     border-radius: 10px; margin-top: 15px; display: flex; align-items: center; 
                     justify-content: center; color: #00ff00; font-size: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="light red" id="redLight" onclick="activate('red')"></div>
        <div class="light yellow" id="yellowLight" onclick="activate('yellow')"></div>
        <div class="light green" id="greenLight" onclick="activate('green')"></div>
        <div id="timer-box">--</div>
    </div>

    <script>
        let isRunning = false;
        // Ініціалізація аудіо з перевіркою підтримки
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playClick(freq) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function speak(text) {
            window.speechSynthesis.cancel(); // Зупиняємо попередній голос
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'uk-UA';
            window.speechSynthesis.speak(speech);
        }

        function activate(color) {
            if (isRunning) return;
            
            // "Розблокування" аудіо для мобільних браузерів при першому кліку
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            isRunning = true;
            
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            document.getElementById(color + 'Light').classList.add('active');
            const timerDisplay = document.getElementById('timer-box');

            if (color === 'red') {
                timerDisplay.innerText = "--";
                speak('Червоний. Стоп, заборонено!');
                setTimeout(() => isRunning = false, 2000);
            } else if (color === 'yellow') {
                timerDisplay.innerText = "--";
                speak('Жовтий. Увага, приготуйся!');
                setTimeout(() => isRunning = false, 2000);
            } else {
                speak('Зелений. Рух продовжуй!');
                let timeLeft = 10;
                
                let interval = setInterval(() => {
                    timerDisplay.innerText = timeLeft;
                    playClick(timeLeft > 5 ? 600 : 800);
                    
                    if (timeLeft <= 5 && timeLeft > 0) {
                        setTimeout(() => playClick(900), 500); // Прискорений звук "цок"
                    }
                    
                    timeLeft--;
                    
                    if (timeLeft < 0) {
                        clearInterval(interval);
                        document.getElementById('greenLight').classList.remove('active');
                        timerDisplay.innerText = "--";
                        isRunning = false;
                    }
                }, 1000);
            }
        }
    </script>
</body>
</html>
