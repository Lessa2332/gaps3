<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Traffic Light</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; margin: 0; height: 100vh; font-family: sans-serif; }
        .container { background: #000; padding: 20px; border-radius: 20px; border: 4px solid #444; display: flex; flex-direction: column; align-items: center; }
        .light { width: 80px; height: 80px; border-radius: 50%; margin: 10px; background: #333; cursor: pointer; transition: 0.2s; }
        .red.active { background: #ff0000; box-shadow: 0 0 30px #ff0000; }
        .yellow.active { background: #ffff00; box-shadow: 0 0 30px #ffff00; }
        .green.active { background: #00ff00; box-shadow: 0 0 30px #00ff00; }
        #timer-box { width: 80px; height: 50px; background: #111; color: #00ff00; margin-top: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="light red" id="redLight" onclick="startSystem('red')"></div>
        <div class="light yellow" id="yellowLight" onclick="startSystem('yellow')"></div>
        <div class="light green" id="greenLight" onclick="startSystem('green')"></div>
        <div id="timer-box">--</div>
    </div>

    <script>
        let audioCtx;
        let isRunning = false;

        // Функція "цок" (синтез звуку)
        function playClick(freq) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function speak(text, lang) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = lang;
            window.speechSynthesis.speak(speech);
        }

        function startSystem(color) {
            // Обов'язкове розблокування звуку
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isRunning && color !== 'red') return;
            if (window.timerInterval) clearInterval(window.timerInterval);
            
            isRunning = true;
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            document.getElementById(color + 'Light').classList.add('active');

            if (color === 'green') {
                speak('Green. Go!', 'en-GB');
                let timeLeft = 10;
                document.getElementById('timer-box').innerText = timeLeft;
                
                window.timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft >= 0) {
                        document.getElementById('timer-box').innerText = timeLeft;
                        playClick(600); // Звук цокання
                    } else {
                        clearInterval(window.timerInterval);
                        isRunning = false;
                    }
                }, 1000);
            } else {
                speak(color === 'red' ? 'Red. Stop!' : 'Yellow. Caution!', 'en-GB');
                setTimeout(() => isRunning = false, 1500);
            }
        }
    </script>
</body>
</html>
