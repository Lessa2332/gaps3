<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пішохідний Світлофор</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background: #222; margin: 0; padding-top: 20px; font-family: sans-serif; }
        .container { background: #000; padding: 20px; border-radius: 20px; }
        .light { width: 100px; height: 100px; border-radius: 50%; margin: 10px; background: #333; }
        
        .red.active { background: red; box-shadow: 0 0 30px red; }
        .green.active { background: green; box-shadow: 0 0 30px green; }
        
        #timer { color: white; font-size: 48px; margin-top: 20px; font-weight: bold; height: 60px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="light red" id="redLight" onclick="activate('red')"></div>
        <div class="light green" id="greenLight" onclick="activate('green')"></div>
    </div>
    <div id="timer"></div>

    <script>
        let countdown;
        let isRunning = false;

        function speak(text, rate = 1) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'uk-UA';
            speech.rate = rate; // швидкість мовлення
            window.speechSynthesis.speak(speech);
        }

        function activate(color) {
            if (isRunning) return;
            isRunning = true;
            
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            document.getElementById(color + 'Light').classList.add('active');

            if (color === 'red') {
                speak('Червоний. Стоп, заборонено!');
                isRunning = false;
            } else {
                let timeLeft = 10;
                const timerDisplay = document.getElementById('timer');
                
                speak('Зелений. Рух продовжуй!');

                countdown = setInterval(() => {
                    timeLeft--;
                    timerDisplay.innerText = timeLeft > 0 ? timeLeft : "";

                    if (timeLeft === 5) {
                        speak('Поспішай, зелений закінчується!', 1.5); // пришвидшений голос
                    }

                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        document.getElementById('greenLight').classList.remove('active');
                        isRunning = false;
                    }
                }, 1000);
            }
        }
    </script>
</body>
</html>
