<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Залізничний світлофор</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: #2b2b2b; margin: 0; height: 100vh; font-family: sans-serif;
            touch-action: manipulation; /* Покращує реакцію на дотики */
        }
        .container { 
            background: #000; padding: 20px; border-radius: 30px; border: 6px solid #444; 
            display: flex; flex-direction: column; align-items: center;
        }
        .light { 
            width: 110px; height: 110px; border-radius: 50%; margin: 15px; 
            background: #222; border: 4px solid #333; transition: 0.2s;
        }
        /* Залізничні кольори: Червоний та Місячно-білий (як дозвіл) */
        .red.active { background: #ff0000; box-shadow: 0 0 50px #ff0000; border-color: #fff; }
        .white.active { background: #e0ffff; box-shadow: 0 0 50px #e0ffff; border-color: #fff; }
        
        #status-text { color: #aaa; margin-top: 20px; font-size: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="container">
        <div class="light red" id="redLight" onclick="activate('red')"></div>
        <div class="light white" id="whiteLight" onclick="activate('white')"></div>
        <div id="status-text">Обери сигнал</div>
    </div>

    <script>
        let audioCtx;

        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'uk-UA';
            window.speechSynthesis.speak(speech);
        }

        function activate(color) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(color + 'Light');
            el.classList.add('active');

            if (color === 'red') {
                document.getElementById('status-text').innerText = "Поїзд близько!";
                speak('Червоний. Зупинись, поїзд проїжджає!');
            } else {
                document.getElementById('status-text').innerText = "Шлях вільний!";
                speak('Білий. Шлях вільний, можна їхати!');
            }
        }
    </script>
</body>
</html>
