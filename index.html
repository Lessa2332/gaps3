<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Traffic Light</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; margin: 0; height: 100vh; font-family: sans-serif; }
        .container { background: #000; padding: 20px; border-radius: 20px; border: 4px solid #444; display: flex; flex-direction: column; align-items: center; }
        .light { width: 80px; height: 80px; border-radius: 50%; margin: 10px; background: #333; cursor: pointer; transition: 0.2s; }
        .red.active { background: #ff0000; box-shadow: 0 0 30px #ff0000; }
        .yellow.active { background: #ffff00; box-shadow: 0 0 30px #ffff00; }
        .green.active { background: #00ff00; box-shadow: 0 0 30px #00ff00; }
        #timer-box { width: 80px; height: 50px; background: #111; color: #00ff00; margin-top: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; border-radius: 10px; }
        .controls { margin-top: 20px; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="light red" id="redLight" onclick="activate('red')"></div>
        <div class="light yellow" id="yellowLight" onclick="activate('yellow')"></div>
        <div class="light green" id="greenLight" onclick="activate('green')"></div>
        <div id="timer-box">--</div>
    </div>

    <div class="controls">
        <label>
            Language: 
            <select id="langSelect" onchange="changeLang()">
                <option value="uk-UA">Українська</option>
                <option value="en-GB">English</option>
            </select>
        </label>
    </div>

    <script>
        let isRunning = false;
        const phrases = {
            'uk-UA': { red: 'Червоний. Стоп!', yellow: 'Жовтий. Увага!', green: 'Зелений. Рух!' },
            'en-GB': { red: 'Red light. Stop!', yellow: 'Yellow light. Caution!', green: 'Green light. Go!' }
        };

        function changeLang() {
            localStorage.setItem('trafficLang', document.getElementById('langSelect').value);
        }

        // Завантажуємо налаштування мови
        document.getElementById('langSelect').value = localStorage.getItem('trafficLang') || 'uk-UA';

        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = document.getElementById('langSelect').value;
            window.speechSynthesis.speak(speech);
        }

        function activate(color) {
            if (isRunning && color !== 'red') return;
            if (window.timerInterval) clearInterval(window.timerInterval);
            
            isRunning = true;
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            document.getElementById(color + 'Light').classList.add('active');
            
            const lang = document.getElementById('langSelect').value;
            speak(phrases[lang][color]);

            if (color !== 'green') {
                setTimeout(() => isRunning = false, 1500);
            } else {
                let timeLeft = 10;
                document.getElementById('timer-box').innerText = timeLeft;
                window.timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft >= 0) {
                        document.getElementById('timer-box').innerText = timeLeft;
                    } else {
                        clearInterval(window.timerInterval);
                        document.getElementById('greenLight').classList.remove('active');
                        document.getElementById('timer-box').innerText = "--";
                        isRunning = false;
                    }
                }, 1000);
            }
        }
    </script>
</body>
</html>
