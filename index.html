<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Світлофор переїзду</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: #1a1a1a; margin: 0; height: 100vh; font-family: sans-serif;
            touch-action: manipulation;
        }
        .container { 
            background: #000; padding: 20px; border-radius: 20px; border: 8px solid #333; 
            display: flex; flex-direction: column; align-items: center;
        }
        .light { 
            width: 100px; height: 100px; border-radius: 50%; margin: 10px; 
            background: #222; transition: 0.1s;
        }
        /* Червоні вогні переїзду */
        .red-1.active { background: #ff0000; box-shadow: 0 0 50px #ff0000; }
        .red-2.active { background: #ff0000; box-shadow: 0 0 50px #ff0000; }
        .white.active { background: #e0ffff; box-shadow: 0 0 50px #e0ffff; }
        
        button { margin-top: 20px; padding: 15px 30px; font-size: 18px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container" onclick="toggleSignal()">
        <div class="light red-1" id="r1"></div>
        <div class="light red-2" id="r2"></div>
        <div class="light white" id="w1"></div>
    </div>
    <p style="color: #666; margin-top: 10px;">Натисни на світлофор</p>

    <script>
        let state = 0; // 0 - вимкнено, 1 - червоні, 2 - білий
        let interval;

        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'uk-UA';
            window.speechSynthesis.speak(speech);
        }

        function toggleSignal() {
            clearInterval(interval);
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));

            state = (state + 1) % 3;

            if (state === 1) { // Червоні блимають
                speak('Червоний. Поїзд, стій!');
                let toggle = false;
                interval = setInterval(() => {
                    document.getElementById('r1').classList.toggle('active', toggle);
                    document.getElementById('r2').classList.toggle('active', !toggle);
                    toggle = !toggle;
                }, 500);
            } else if (state === 2) { // Білий
                speak('Білий. Можна їхати.');
                document.getElementById('w1').classList.add('active');
            } else {
                speak('Світлофор вимкнено.');
            }
        }
    </script>
</body>
</html>
