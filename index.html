<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра Світлофор</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; background: #333; height: 100vh; margin: 0; justify-content: center; }
        .container { background: #000; padding: 30px; border-radius: 30px; border: 5px solid #555; }
        .light { width: 120px; height: 120px; border-radius: 50%; margin: 20px 0; background: #222; transition: 0.2s; border: 4px solid #444; }
        
        .red.active { background: red; box-shadow: 0 0 40px red; border-color: white; }
        .yellow.active { background: yellow; box-shadow: 0 0 40px yellow; border-color: white; }
        .green.active { background: green; box-shadow: 0 0 40px green; border-color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="light red" onclick="playTraffic(this, 'Червоний. Стоп, заборонено!')"></div>
        <div class="light yellow" onclick="playTraffic(this, 'Жовтий. Увага, приготуйся!')"></div>
        <div class="light green" onclick="playTraffic(this, 'Зелений. Рух продовжуй!')"></div>
    </div>

    <script>
        let isSpeaking = false; // Змінна для перевірки стану мовлення

        function playTraffic(element, message) {
            // Якщо голос вже говорить, нічого не робимо
            if (isSpeaking) return;

            // Вимикаємо підсвітку у всіх
            document.querySelectorAll('.light').forEach(el => el.classList.remove('active'));
            
            // Вмикаємо вибраний
            element.classList.add('active');

            // Озвучка
            isSpeaking = true;
            const speech = new SpeechSynthesisUtterance(message);
            speech.lang = 'uk-UA';
            
            // Коли голос закінчив говорити, дозволяємо натискати знову
            speech.onend = () => {
                isSpeaking = false;
            };
            
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
